services:
    production:
        container_name: pankogpt-prod
        build:
            context: .
        image: panko-gpt:0.7.8
        environment:
            - MONGO_ATLAS_PUBLIC_KEY=
            - MONGO_ATLAS_PRIVATE_KEY=
            - MONGO_ATLAS_PROJECT_ID=
            - MONGO_ATLAS_CLUSTER_NAME=
            - MONGO_DB_NAME=
            - GLOBAL_OPEN_AI_KEY=
        ports:
            - '5004:5004'
            - '5005:5005'
    development:
        container_name: pankogpt-dev
        build:
            context: .
        image: panko-gpt-dev
        environment:
            - NODE_ENV=development
            - API_URL=http://localhost:5004
            - MONGO_ATLAS_PUBLIC_KEY=
            - MONGO_ATLAS_PRIVATE_KEY=
            - MONGO_ATLAS_PROJECT_ID=
            - MONGO_ATLAS_CLUSTER_NAME=
            - MONGO_ATLAS_DB_NAME=
            - GLOBAL_OPEN_AI_KEY=
        volumes:
            - './backend/data:/usr/src/backend/data'
            - './backend/src:/usr/src/backend/src'
            - './frontend/src:/usr/src/frontend/src'
        ports:
            - '5004:5004'
            - '5005:5005'
