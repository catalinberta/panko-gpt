services:
    backend:
        container_name: panko-gpt-backend
        platform: linux/amd64
        build:
            context: ./backend
        ports:
            - '5004:5004'
        networks:
            - panko-network
        environment:
            - NEXT_TELEMETRY_DISABLED=1
            - NODE_ENV=production
            - MONGO_ATLAS_PUBLIC_KEY=
            - MONGO_ATLAS_PRIVATE_KEY=
            - MONGO_ATLAS_PROJECT_ID=
            - MONGO_ATLAS_CLUSTER_NAME=
            - MONGO_DB_NAME=pankogpt
            - GLOBAL_OPEN_AI_KEY=

    frontend:
        build:
            context: ./frontend
        ports:
            - '5005:5005'
        networks:
            - panko-network
        depends_on:
            - backend
        environment:
            - NEXT_TELEMETRY_DISABLED=1
            - NEXT_PUBLIC_API_URL=http://localhost:5004
            - INTERNAL_API_URL=http://backend:5004

networks:
    panko-network:
        driver: bridge
